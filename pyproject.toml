[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naruto-agent-lab"
version = "0.1.0"
description = "Screen-only multi-character fighting-agent research platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "platformdirs>=4,<5",
  "psutil>=5.9",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
windows = [
  "dxcam",
  "pywin32",
  "pynput>=1.7",
]
vision = [
  "opencv-python>=4.8",
]
ml = [
  "torch",
  "torchvision",
  "einops",
]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML>=6",
]

[project.scripts]
naruto-doctor = "naruto_agent.cli.doctor:app"
naruto-runtime = "naruto_agent.cli.main:app"
naruto-episode = "naruto_agent.cli.episode:app"

[tool.hatch.build.targets.wheel]
packages = ["src/naruto_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: requires a real emulator and explicit manual enablement",
  "windows: requires native Windows",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["naruto_agent"]
